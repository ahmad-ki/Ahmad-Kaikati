apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-advisor-v3-backend
  labels:
    app.kubernetes.io/name: smart-advisor-v3-backend
    app.kubernetes.io/version: "3.0-enterprise"
spec:
  replicas: 3
  selector:
    matchLabels: { app: smart-advisor-v3-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: smart-advisor-v3-backend
        app.kubernetes.io/version: "3.0-enterprise"
    spec:
      containers:
      - name: backend
        image: ahmadki123/smart-advisor-v3-backend:v3.0
        imagePullPolicy: Always
        ports: [{ containerPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-advisor-v3-frontend
  labels:
    app.kubernetes.io/name: smart-advisor-v3-frontend
    app.kubernetes.io/version: "3.0-enterprise"
spec:
  replicas: 2
  selector:
    matchLabels: { app: smart-advisor-v3-frontend }
  template:
    metadata:
      labels:
        app: smart-advisor-v3-frontend
        app.kubernetes.io/version: "3.0-enterprise"
    spec:
      containers:
      - name: frontend
        image: ahmadki123/smart-advisor-v3-frontend:v3.0
        imagePullPolicy: Always
        ports: [{ containerPort: 80 }]
